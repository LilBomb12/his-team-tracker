name: Sync to Vercel Deploy Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LilBomb12 repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to aliIslam123 (Vercel-linked repo)
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add target https://x-access-token:${SYNC_TOKEN}@github.com/aliIslam123/his-team-tracker.git || true
          git push -f target main
